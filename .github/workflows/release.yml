name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

# Never cancel a release mid-publish. A tag push and the `release: published`
# event for that same tag share a group, so they queue instead of racing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  tests:
    permissions:
      contents: read
    uses: ljmerza/misc-actions/.github/workflows/node-tests.yml@v2
    with:
      node-version: "22"
      test-command: "npm run test:coverage"
      codecov-flags: library
    secrets: inherit

  # This job must stay in this repository. npm's trusted publisher is registered
  # against an entry-point workflow filename, and npm validates the *calling*
  # workflow when `workflow_call` is involved — so the publish itself runs here,
  # in release.yml, using composite actions that execute inside this job.
  publish-npm:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # A `release: published` run checks out the default branch otherwise.
          ref: ${{ github.event.release.tag_name || github.ref_name }}

      - uses: ljmerza/misc-actions/actions/npm-build@v2
        with:
          node-version: "24"
          # Fails the release if the tag and package.json have drifted.
          expected-version: ${{ github.event.release.tag_name || github.ref_name }}
          cache: "false"
          artifact-name: npm-package

      # skip-if-published defaults to true, so whichever of the two events runs
      # second is a no-op rather than an EPUBLISHCONFLICT failure.
      - uses: ljmerza/misc-actions/actions/npm-publish@v2
        with:
          node-version: "24"

  # Only for a bare tag push: a `release: published` run already has its release.
  github-release:
    needs: publish-npm
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # github-release passes --verify-tag, which makes gh shell out to git.
      # Without a checkout that fails with "not a git repository".
      - uses: actions/checkout@v6

      - uses: ljmerza/misc-actions/actions/github-release@v2
        with:
          tag: ${{ github.ref_name }}
          title: react-social-feed ${{ github.ref_name }}
          artifact-name: npm-package
          artifact-path: npm-package
          github-token: ${{ secrets.GITHUB_TOKEN }}
